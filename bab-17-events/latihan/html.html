<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <!-- kelompok pertama -->
    <div class="kelompok1">
      <div class="imgntks">
        <img src="n bandung.png" />
        <div class="tksimg">
          <p class="judulfilm"><b>DAN BANDUNG</b></p>
          <p class="tks1">Tayang : 20 Agustus 2026</p>
          <p class="tks2">Drama, Romance</p>
          <p class="tks3">Malang/Kediri/Blitar/Surabaya/Semarang/Bali</p>
          <div class="formnama">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" placeholder="nama lengkap" autofocus />
            <div class="char-count" id="char-count">Jumlah karakter: 0</div>
            <div class="key-message" id="key-message"></div>
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="email" />
            <label for="location" style="margin-top: 15px">Lokasi:</label>
            <input
              type="location"
              id="location"
              placeholder="Malang/Kediri/Blitar/Surabaya/Semarang/Bali"
            />
          </div>
          <div class="button-group">
            <button type="submit" class="btn btn-primary">
              Daftar Sekarang
            </button>
            <button type="button" id="reset-btn" class="btn btn-secondary">
              Reset Form
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- kelompok kedua -->
    <div class="kelompok2">
      <h1>Daftar Pemboking</h1>
      <div class="daftar">
        <p class="tulisankosong"><i>Belum ada peserta</i></p>
      </div>
    </div>

    <script src="js.js"></script>
  </body>
</html>
